<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      The application handles confidential material, so it is kept out of search
      indexes and out of referrer headers sent to third parties.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />

    <meta
      name="description"
      content="LXTranslator: translation management for software localization files."
    />

    <!--
      Inline SVG favicon as a data URI. The design system forbids external
      requests, so no icon file is fetched over the network.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b7189'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' fill='%23fff' text-anchor='middle'%3ELX%3C/text%3E%3C/svg%3E"
    />

    <title>LXTranslator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
